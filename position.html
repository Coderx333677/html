<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
</head>

<style>

    .box1{
        height: 200px;
        width: 200px;
        background-color: red;
    }
    .box2{
        height: 200px;
        width: 200px;
        background-color: rgb(80, 128, 231);
    }
    .box3{
        height: 200px;
        width: 200px;
        background-color: yellow;
    }

    .design{

        display: flex;

        margin: 10px;

    }

    .static{
        position: static;
    }

    .relative{
        position: relative;
        top: 20px;
        left: 20px;
    }

    .absolute{
        position: absolute;
        top: 1200px;
        left: 700px;

    }
    
    .fixed{
        position: fixed;
        top: 20px;
    }

    .stick{
        position: sticky;
        top: 0;

        z-index: 10;
    
        
    }

</style>

<body>



    
    <div>

        <h2>Position Sticky</h2>
        <div class="design" style="height: 500px;" >

            <div class="box1"></div>
            <div class="box2"></div>
            <div class="box3 stick">I am sticky</div>

        </div>

        
        <h2>Position static</h2>

        <div class="static design">

            

            <div class="box1"></div>
            <div class="box2"></div>
            <div class="box3"></div>

        </div>

        <h2>Position relative</h2>

        <div class="design">

            <div class="box1"></div>
            <div class="box2 relative"></div>
            <div class="box3"></div>

        </div>

         <h2>Position absolute</h2>

        <div class="design">

            <div class="box1"></div>
            <div class="box2 absolute "></div>
            <div class="box3"></div>

        </div>

        <h2>Position Fixed</h2>
        <div class="design">

            <div class="box1"></div>
            <div class=" fixed  box2">I am fixed</div>
            <div class="box3"></div>

        </div>

        
    </div>
    
</body>
</html>
