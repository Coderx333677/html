<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <!-- DIV Example: Creates separate boxes stacked vertically -->
    <div style="background-color: lightblue;">This is the first section.</div>
    <div style="background-color: lightgreen;">This is a separate section below it.</div>

    <!-- SPAN Example: Changes text color without breaking the line -->
    <p>
        The quick brown fox <span style="color: red;">jumps</span> over the lazy dog.
    </p>



    
</body>
</html>
